<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model 8600 — Arithmetic Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #16181a;
    --bg-2: #0e0f10;
    --body-panel: #232628;
    --body-panel-light: #2b2e30;
    --bezel-shadow: #08090a;
    --screen-bg: #10120f;
    --screen-glow: #ff9142;
    --screen-glow-dim: #8a4c1f;
    --key-num: #33363a;
    --key-num-hi: #3d4045;
    --key-fn: #45484c;
    --key-fn-hi: #52565a;
    --key-op: #e0742a;
    --key-op-hi: #f2843a;
    --ink: #f1eee6;
    --ink-dim: #8b8d8f;
    --plate: #9a9d9f;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #24272a 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    font-family:'Space Grotesk', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
  }

  .unit{
    width: 340px;
    max-width: 100%;
    background: linear-gradient(160deg, var(--body-panel-light) 0%, var(--body-panel) 55%, #202224 100%);
    border-radius: 22px;
    padding: 20px 18px 24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 -30px 60px rgba(0,0,0,0.35) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 2px 0 rgba(255,255,255,0.03);
    position:relative;
  }

  .plate{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 2px 6px 14px;
    font-family:'Share Tech Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--plate);
    text-transform: uppercase;
  }
  .plate span:last-child{ color: #5f6265; }

  .screen{
    background: var(--screen-bg);
    border-radius: 12px;
    padding: 22px 18px 16px;
    margin-bottom: 16px;
    box-shadow:
      inset 0 3px 10px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(0,0,0,0.6);
    min-height: 108px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }

  .screen-history{
    font-family:'Share Tech Mono', monospace;
    font-size: 15px;
    color: #6b5240;
    text-align:right;
    min-height: 20px;
    letter-spacing: 0.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  .screen-main{
    font-family:'Share Tech Mono', monospace;
    font-size: 42px;
    text-align:right;
    color: var(--screen-glow);
    text-shadow:
      0 0 6px rgba(255,145,66,0.75),
      0 0 22px rgba(255,145,66,0.45),
      0 0 44px rgba(255,145,66,0.2);
    white-space:nowrap;
    overflow:hidden;
    letter-spacing: 0.01em;
    transition: text-shadow 0.15s ease;
  }

  .screen.error .screen-main{
    color: #ff5a5a;
    text-shadow: 0 0 8px rgba(255,90,90,0.8), 0 0 26px rgba(255,90,90,0.4);
  }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button.key{
    appearance:none;
    border:none;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: 19px;
    color: var(--ink);
    padding: 16px 0;
    border-radius: 12px;
    cursor:pointer;
    position:relative;
    user-select:none;
    transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.1s ease;
  }

  .key-num{
    background: linear-gradient(160deg, var(--key-num-hi), var(--key-num));
    box-shadow:
      0 3px 0 rgba(0,0,0,0.45),
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .key-fn{
    background: linear-gradient(160deg, var(--key-fn-hi), var(--key-fn));
    box-shadow:
      0 3px 0 rgba(0,0,0,0.45),
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
    color: #d9d3c8;
    font-size: 16px;
  }
  .key-op{
    background: linear-gradient(160deg, var(--key-op-hi), var(--key-op));
    box-shadow:
      0 3px 0 #a8511a,
      0 4px 10px rgba(224,116,42,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25);
    color: #2a1300;
    font-size: 21px;
  }
  .key-eq{
    background: linear-gradient(160deg, #ffb15c, #e0742a);
    box-shadow:
      0 3px 0 #a8511a,
      0 4px 14px rgba(224,116,42,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3);
    color: #2a1300;
  }

  button.key:active{
    transform: translateY(3px);
    filter: brightness(0.95);
  }
  .key-num:active, .key-fn:active{
    box-shadow: 0 0 0 rgba(0,0,0,0.45), inset 0 2px 4px rgba(0,0,0,0.4);
  }
  .key-op:active, .key-eq:active{
    box-shadow: 0 0 0 #a8511a, inset 0 2px 4px rgba(0,0,0,0.35);
  }

  .span-2{ grid-column: span 2; }

  button.key:focus-visible{
    outline: 2px solid #ffd9ac;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    button.key{ transition:none; }
  }

  .footnote{
    text-align:center;
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #55585b;
    font-family:'Share Tech Mono', monospace;
  }
</style>
</head>
<body>

<div class="unit">
  <div class="plate">
    <span>Model 8600</span>
    <span>Arithmetic Unit · No. 004</span>
  </div>

  <div class="screen" id="screen">
    <div class="screen-history" id="history">&nbsp;</div>
    <div class="screen-main" id="display">0</div>
  </div>

  <div class="pad">
    <button class="key key-fn" data-action="clear">C</button>
    <button class="key key-fn" data-action="backspace">⌫</button>
    <button class="key key-fn" data-action="percent">%</button>
    <button class="key key-op" data-op="÷">÷</button>

    <button class="key key-num" data-num="7">7</button>
    <button class="key key-num" data-num="8">8</button>
    <button class="key key-num" data-num="9">9</button>
    <button class="key key-op" data-op="×">×</button>

    <button class="key key-num" data-num="4">4</button>
    <button class="key key-num" data-num="5">5</button>
    <button class="key key-num" data-num="6">6</button>
    <button class="key key-op" data-op="−">−</button>

    <button class="key key-num" data-num="1">1</button>
    <button class="key key-num" data-num="2">2</button>
    <button class="key key-num" data-num="3">3</button>
    <button class="key key-op" data-op="+">+</button>

    <button class="key key-num span-2" data-num="0">0</button>
    <button class="key key-num" data-action="decimal">.</button>
    <button class="key key-eq" data-action="equals">=</button>
  </div>

  <div class="footnote">Precision · Reliable · 1980-series design</div>
</div>

<script>
(function(){
  const displayEl = document.getElementById('display');
  const historyEl = document.getElementById('history');
  const screenEl = document.getElementById('screen');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;
  let lastAction = null; // for chaining "=" repeats

  const MAX_DIGITS = 12;

  function formatNumber(numStr){
    if (numStr === 'Error') return numStr;
    const num = Number(numStr);
    if (!isFinite(num)) return 'Error';
    let str = numStr;
    if (str.length > MAX_DIGITS) {
      str = num.toPrecision(10);
      str = parseFloat(str).toString();
    }
    return str;
  }

  function updateDisplay(){
    displayEl.textContent = formatNumber(current);
    if (previous !== null && operator){
      historyEl.textContent = `${trimTrailing(previous)} ${operator}`;
    } else {
      historyEl.textContent = '\u00A0';
    }
    screenEl.classList.toggle('error', current === 'Error');
  }

  function trimTrailing(n){
    return n;
  }

  function inputDigit(d){
    if (screenEl.classList.contains('error')) resetAll();
    if (overwrite){
      current = d;
      overwrite = false;
    } else {
      if (current === '0') current = d;
      else if (current.replace('-','').replace('.','').length < MAX_DIGITS) current += d;
    }
    updateDisplay();
  }

  function inputDecimal(){
    if (screenEl.classList.contains('error')) resetAll();
    if (overwrite){
      current = '0.';
      overwrite = false;
      updateDisplay();
      return;
    }
    if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function resetAll(){
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
    screenEl.classList.remove('error');
  }

  function backspace(){
    if (screenEl.classList.contains('error')){ resetAll(); updateDisplay(); return; }
    if (overwrite) return;
    current = current.slice(0, -1);
    if (current === '' || current === '-') current = '0';
    if (current === '0') overwrite = true;
    updateDisplay();
  }

  function percent(){
    if (screenEl.classList.contains('error')) resetAll();
    const val = parseFloat(current);
    current = String(val / 100);
    overwrite = true;
    updateDisplay();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function chooseOperator(op){
    if (screenEl.classList.contains('error')){ resetAll(); }
    if (operator && !overwrite){
      const result = compute(previous, current, operator);
      previous = isNaN(result) ? 'Error' : String(result);
      current = previous;
      if (previous === 'Error'){
        updateDisplay();
        operator = null;
        overwrite = true;
        return;
      }
    } else {
      previous = current;
    }
    operator = op;
    overwrite = true;
    updateDisplay();
  }

  function equals(){
    if (screenEl.classList.contains('error')) return;
    if (operator === null || previous === null) return;
    const result = compute(previous, current, operator);
    if (isNaN(result) || !isFinite(result)){
      current = 'Error';
      previous = null;
      operator = null;
    } else {
      current = String(result);
      previous = null;
      operator = null;
    }
    overwrite = true;
    updateDisplay();
  }

  document.querySelectorAll('.key').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = btn.getAttribute('data-num');
      const op = btn.getAttribute('data-op');
      const action = btn.getAttribute('data-action');

      if (num !== null) inputDigit(num);
      else if (op !== null) chooseOperator(op);
      else if (action === 'clear') { resetAll(); updateDisplay(); }
      else if (action === 'backspace') backspace();
      else if (action === 'percent') percent();
      else if (action === 'decimal') inputDecimal();
      else if (action === 'equals') equals();
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9'){ inputDigit(e.key); return; }
    if (e.key === '.') { inputDecimal(); return; }
    if (e.key === '+') { chooseOperator('+'); return; }
    if (e.key === '-') { chooseOperator('−'); return; }
    if (e.key === '*') { chooseOperator('×'); return; }
    if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); return; }
    if (e.key === 'Enter' || e.key === '=') { equals(); return; }
    if (e.key === 'Backspace') { backspace(); return; }
    if (e.key === 'Escape') { resetAll(); updateDisplay(); return; }
    if (e.key === '%') { percent(); return; }
  });

  updateDisplay();
})();
</script>

</body>
</html>
